name: Build Windows packages

# hacktv-gui for Windows x64: NSIS installer (Standard or Portable install)
# and a portable .zip. Both bundle hacktv.exe built from inaxeon/hacktv
# (HackDAC support) with upstream's own build_win64.sh, its test signals,
# and a Temurin 21 JRE.
#
# Unsigned (the upstream release signing uses the maintainer's certificate),
# so SmartScreen will warn on first run.

# Run as part of "Build and release" (release.yml); can also be run alone
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (blank = short commit hash)"
        required: false
        type: string
  # Called by release.yml, which builds every platform and publishes one release
  workflow_call:
    inputs:
      version:
        description: "Version (blank = short commit hash)"
        required: false
        type: string

permissions:
  contents: read

env:
  HACKTV_REPO: https://github.com/inaxeon/hacktv.git
  HACKTV_COMMIT: 7a3e30564cd35feeb1c09d9f74cce6907d177a77
  HACKTV_VERSION: 20260223-7a3e305
  JRE_URL: https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.9%2B10/OpenJDK21U-jre_x64_windows_hotspot_21.0.9_10.zip
  JRE_SHA256: 39c5e23f3ce4d420663afba8ffde28034b72e2b3e240943dc2321bc1f912eef9

jobs:
  hacktv:
    name: hacktv.exe (x64, MinGW cross build)
    runs-on: ubuntu-24.04

    steps:
      - name: Install MinGW toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 mingw-w64-tools \
            git make libtool cmake yasm nasm patch dpkg-dev autoconf automake pkg-config \
            wget bzip2 xz-utils gettext

      - name: Check out hacktv (pinned)
        run: |
          git clone -q "$HACKTV_REPO" hacktv
          git -C hacktv checkout -q "$HACKTV_COMMIT"
          git -C hacktv submodule update --init --recursive -q

      - name: Build hacktv.exe with upstream build_win64.sh
        working-directory: hacktv/src
        run: |
          # Work on an untracked copy: editing the tracked script would mark
          # the tree dirty and change hacktv's version string.
          cp build_win64.sh build_win64_ci.sh
          # Known Debian/Ubuntu fix (hacktv-gui wiki, "opus not found using
          # pkg-config"): add -fstack-protector to the FFmpeg and final links.
          sed -i 's|--pkg-config=pkg-config --prefix=$PREFIX$|--pkg-config=pkg-config --prefix=$PREFIX --extra-ldflags="-fstack-protector"|' build_win64_ci.sh
          sed -i 's|EXTRA_LDFLAGS="-static"|EXTRA_LDFLAGS="-static -fstack-protector"|' build_win64_ci.sh
          grep -n 'fstack-protector' build_win64_ci.sh
          bash ./build_win64_ci.sh > ../../build_win64.log 2>&1 || { tail -80 ../../build_win64.log; exit 1; }

      - name: Verify hacktv.exe
        working-directory: hacktv
        run: |
          file src/hacktv.exe | tee /dev/stderr | grep -q 'PE32+ executable.*x86-64'
          v="$(strings -a src/hacktv.exe | grep -E '^[0-9]{8}-[0-9a-f]{7}' | head -1)"
          echo "version: $v"
          test "$v" = "$HACKTV_VERSION"
          strings -a src/hacktv.exe | grep -q 'hackrf_set_hackdac_mode' || { echo "no HackDAC support"; exit 1; }
          # Static build: no MinGW runtime or library DLLs may be imported
          # (Windows system DLLs are fine)
          x86_64-w64-mingw32-objdump -p src/hacktv.exe | awk '/DLL Name/{print $3}' | sort -u | tee dlls.txt
          # (names listed explicitly: a bare "av" prefix also hits AVICAP32.dll)
          if grep -i -E '^(lib|avcodec|avformat|avutil|avdevice|avfilter|swscale|swresample|postproc|hackrf|usb|osmo)|pthread|gcc_s|stdc\+\+' dlls.txt; then
            echo "hacktv.exe imports non-system DLLs (not a static build)"; exit 1
          fi
          ls testsignals/*.bin | wc -l

      - name: Pack hacktv.exe
        run: |
          mkdir -p out/testsignals
          cp hacktv/src/hacktv.exe out/
          cp hacktv/testsignals/*.bin out/testsignals/
          tar -C out -czf hacktv-windows-x64.tar.gz .

      - name: Upload hacktv.exe
        uses: actions/upload-artifact@v7
        with:
          name: hacktv-windows-x64
          path: hacktv-windows-x64.tar.gz
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-log-windows-hacktv
          path: build_win64.log

  package:
    name: Installer and portable zip
    needs: hacktv
    runs-on: windows-2025

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Build native components (ConsoleCtrl DLL, launcher)
        shell: pwsh
        run: |
          function Build($proj) {
            # Use the project's toolset; fall back to VS 2022 (v143) if the
            # runner image does not have the one the project targets.
            msbuild $proj /m /p:Configuration=Release /p:Platform=x64
            if ($LASTEXITCODE -ne 0) {
              Write-Host "Retrying $proj with PlatformToolset=v143"
              msbuild $proj /m /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143
              if ($LASTEXITCODE -ne 0) { throw "msbuild failed: $proj" }
            }
          }
          Build ConsoleCtrl\ConsoleCtrl.slnx
          Build launcher\launcher.slnx
          $native = "src/main/resources/ie/bops/resources/native"
          New-Item -ItemType Directory -Force -Path $native | Out-Null
          Copy-Item "ConsoleCtrl\x64\Release\ConsoleCtrl.dll" "$native\ConsoleCtrl_amd64.dll"

      - name: Build hacktv-gui
        run: mvn -B package

      - name: Determine version
        id: version
        shell: bash
        run: |
          v="${{ inputs.version }}"
          if [ -z "$v" ] && [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF#refs/tags/v}"
          fi
          [ -n "$v" ] || v="$(git rev-parse --short HEAD)"
          # NSIS needs a four-part numeric version
          if [[ "$v" =~ ^[0-9]+(\.[0-9]+)*([-+].*)?$ ]]; then
            IFS=. read -r a b c _ <<< "${v%%[-+]*}"
            nv="${a:-0}.${b:-0}.${c:-0}.0"
          else
            nv="0.0.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "numeric=$nv" >> "$GITHUB_OUTPUT"
          echo "Version: $v ($nv)"

      - name: Download hacktv.exe
        uses: actions/download-artifact@v8
        with:
          name: hacktv-windows-x64
          path: dl

      - name: Stage files
        shell: pwsh
        run: |
          $stage = "stage"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          tar -xzf dl/hacktv-windows-x64.tar.gz -C $stage
          Copy-Item "launcher\x64\Release\hacktv-gui.exe" "$stage\hacktv-gui.exe"
          Copy-Item "target\hacktv-gui.jar" $stage
          Copy-Item "target\lib" "$stage\lib" -Recurse
          Copy-Item "target\licenses" "$stage\licenses" -Recurse
          # Java runtime (pinned, hash-checked)
          $zip = "$env:RUNNER_TEMP\jre.zip"
          Invoke-WebRequest -Uri $env:JRE_URL -OutFile $zip -UseBasicParsing
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne $env:JRE_SHA256.ToUpper()) { throw "JRE hash mismatch" }
          $x = "$env:RUNNER_TEMP\jre"
          Expand-Archive $zip -DestinationPath $x
          $root = Get-ChildItem $x -Directory | Select-Object -First 1
          Copy-Item $root.FullName "$stage\jre" -Recurse
          Get-ChildItem $stage | Format-Table Name, Length

      - name: Install NSIS
        uses: negrutiu/nsis-install@v3

      - name: Build installer
        shell: pwsh
        run: |
          Copy-Item scripts\hacktv-gui_setup.nsi stage
          Push-Location stage
          makensis /DVERSION="${{ steps.version.outputs.numeric }}" /DARCH=x64 /DBUNDLED_HACKTV hacktv-gui_setup.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed" }
          Pop-Location
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Move-Item stage\hacktv-gui_setup.exe "dist\hacktv-gui-${{ steps.version.outputs.version }}-windows-x64-setup.exe"

      - name: Build portable zip
        shell: pwsh
        run: |
          # Same layout as an installed copy: launcher, bin\, jre\, share\
          $p = "portable\hacktv-gui"
          New-Item -ItemType Directory -Force -Path "$p\bin", "$p\share\hacktv\testsignals" | Out-Null
          Copy-Item stage\hacktv-gui.exe $p
          Copy-Item stage\hacktv-gui.jar, stage\hacktv.exe "$p\bin"
          Copy-Item stage\lib "$p\bin\lib" -Recurse
          Copy-Item stage\licenses "$p\bin\licenses" -Recurse
          Copy-Item stage\jre "$p\jre" -Recurse
          Copy-Item stage\testsignals\*.bin "$p\share\hacktv\testsignals"
          Compress-Archive -Path $p -DestinationPath "dist\hacktv-gui-${{ steps.version.outputs.version }}-windows-x64-portable.zip"

      - name: Test installer (silent install)
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\*-setup.exe | Select-Object -First 1
          $dir = "$env:RUNNER_TEMP\htv-install"
          Start-Process -Wait -FilePath $setup.FullName -ArgumentList "/S", "/D=$dir"
          foreach ($f in "hacktv-gui.exe", "bin\hacktv-gui.jar", "bin\hacktv.exe", "bin\ConsoleCtrl_amd64.dll",
                         "jre\bin\java.exe", "share\hacktv\testsignals\pm8546g.bin") {
            if (-not (Test-Path "$dir\$f")) { throw "installer did not install $f" }
          }
          $out = & "$dir\bin\hacktv.exe" --help 2>&1 | Out-String
          if ($out -notmatch "Usage: hacktv") { throw "installed hacktv.exe does not run" }
          & "$dir\jre\bin\java.exe" -version
          Write-Host "Silent install OK"

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem dist\*.exe, dist\*.zip | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content "dist\hacktv-gui-${{ steps.version.outputs.version }}-windows-x64.sha256"
          Get-Content dist\*.sha256

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: hacktv-gui-${{ steps.version.outputs.version }}-windows-x64
          path: dist/*
          if-no-files-found: error
