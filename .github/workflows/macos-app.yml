name: Build macOS universal app

# hacktv-gui.app for Apple Silicon + Intel, with a bundled universal hacktv
# (inaxeon/hacktv, HackDAC support) and bundled Java runtimes.
# Build logic lives in scripts/macos/ so it can be run and tested locally.

on:
  push:
    branches:
      - macos-universal-app
  workflow_dispatch:
    inputs:
      version:
        description: "Version (blank = short commit hash)"
        required: false
        type: string
  # Called by release.yml, which builds every platform and publishes one release
  workflow_call:
    inputs:
      version:
        description: "Version (blank = short commit hash)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  hacktv:
    name: hacktv (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Runner images are pinned: macos-latest can jump a macOS major
          # and silently change the build output.
          #
          # arm64 is cross-compiled on the Intel runner: the hosted arm64
          # pool repeatedly failed to pick up jobs ("The job was not
          # acquired by Runner of type hosted even after multiple
          # attempts", 5 of 6 runs on 2026-11-16). The arm64 slice gets the
          # static checks here; it cannot be executed on Intel.
          - runner: macos-15-intel
            arch: arm64
            target: arm64
          - runner: macos-15-intel
            arch: x86_64
            target: ''

    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install build tools
        run: |
          # Build tools only; no libraries come from Homebrew (the build
          # isolates pkg-config to its own prefix).
          brew list pkgconf >/dev/null 2>&1 || brew install pkgconf
          if [ "${{ matrix.arch }}" = "x86_64" ]; then
            brew list nasm >/dev/null 2>&1 || brew install nasm
          fi
          cmake --version | head -1

      - name: Build hacktv
        env:
          HACKTV_TARGET_ARCH: ${{ matrix.target }}
        run: scripts/build-hacktv.sh "$RUNNER_TEMP/build"

      - name: Check architecture
        run: |
          a="$(lipo -archs "$RUNNER_TEMP/build/out/hacktv-${{ matrix.arch }}")"
          echo "built: $a"
          test "$a" = "${{ matrix.arch }}"

      - name: Pack build output
        # tar keeps the executable bit, which upload-artifact would drop
        run: tar -C "$RUNNER_TEMP/build/out" -czf "hacktv-${{ matrix.arch }}.tar.gz" .

      - name: Upload hacktv (${{ matrix.arch }})
        uses: actions/upload-artifact@v7
        with:
          name: hacktv-macos-${{ matrix.arch }}
          path: hacktv-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs-macos-${{ matrix.arch }}
          path: ${{ runner.temp }}/build/*.log

  app:
    name: Universal app
    needs: hacktv
    # Assembly needs no Apple Silicon (lipo, codesign and hdiutil work on
    # Intel), and the hosted arm64 pool is often out of capacity.
    runs-on: macos-15-intel

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build hacktv-gui
        run: mvn -B package

      - name: Download hacktv builds
        uses: actions/download-artifact@v8
        with:
          pattern: hacktv-macos-*
          path: dl

      - name: Create universal hacktv
        run: |
          for a in arm64 x86_64; do
            mkdir -p "hacktv-$a"
            tar -xzf "dl/hacktv-macos-$a/hacktv-$a.tar.gz" -C "hacktv-$a"
          done
          lipo -create hacktv-arm64/hacktv-arm64 hacktv-x86_64/hacktv-x86_64 -output hacktv-universal
          lipo -info hacktv-universal
          # Both slices must be the same hacktv build
          for a in arm64 x86_64; do
            strings -a "hacktv-$a/hacktv-$a" | grep -E '^[0-9]{8}-[0-9a-f]{7}' | head -1
          done | sort -u | tee versions.txt
          test "$(wc -l < versions.txt)" -eq 1
          # Test signals from both builds must be identical
          diff -r hacktv-arm64/testsignals hacktv-x86_64/testsignals

      - name: Determine version
        id: version
        run: |
          v="${{ inputs.version }}"
          if [ -z "$v" ] && [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF#refs/tags/v}"
          fi
          [ -n "$v" ] || v="$(git rev-parse --short HEAD)"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Version: $v"

      - name: Assemble and package app
        run: |
          scripts/macos/make-app.sh \
            --hacktv hacktv-universal \
            --testsignals hacktv-arm64/testsignals \
            --gui-target target \
            --version "${{ steps.version.outputs.version }}" \
            --out dist

      - name: Check bundled hacktv
        run: |
          test "$(lipo -archs dist/hacktv-gui.app/Contents/app/hacktv | tr ' ' '\n' | sort | xargs)" = "arm64 x86_64"
          # The x86_64 slice and runtime run here; the arm64 slice (cross
          # built) is checked statically and by signature
          dist/hacktv-gui.app/Contents/app/hacktv --help 2>&1 | head -2
          dist/hacktv-gui.app/Contents/runtime/x86_64/bin/java -version
          codesign --verify --strict --verbose=2 dist/hacktv-gui.app

      - name: Upload app
        uses: actions/upload-artifact@v7
        with:
          name: hacktv-gui-${{ steps.version.outputs.version }}-macos-universal
          path: |
            dist/*.zip
            dist/*.dmg
            dist/*.sha256
          if-no-files-found: error
